apiVersion: v1
kind: Service
metadata:
  name: {{ include "hzr.headless" . }}
  labels: {{- include "hzr.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: hazelcast
      port: 5701
      targetPort: 5701
